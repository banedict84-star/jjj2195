<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안산 야구 전광판</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-width:0;min-height:0;background:#000;color:#fff;font-family:Arial,'Malgun Gothic','Noto Sans KR',sans-serif;overflow:hidden}
#displayViewport{position:fixed;inset:0;display:block;width:100dvw;height:100dvh;overflow:hidden}#board{width:1120px;height:624px;background:#07111a;display:grid;grid-template-rows:130px minmax(0,1fr);gap:10px;padding:10px;overflow:hidden}
table{width:100%;height:130px;border-collapse:collapse;text-align:center;table-layout:fixed}td,th{border:1px solid #425465;height:42px;font-size:24px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}th{color:#a4b7c9;font-size:18px}th:first-child{width:210px}td:first-child{font-size:23px;font-weight:bold;padding:0 7px}.away{background:#af1932}.home{background:#1256a4}.total{color:#ffdb35;font-weight:bold}
.main{display:grid;grid-template-columns:230px minmax(0,1fr) 230px;gap:10px;min-height:0}.line{display:grid;grid-template-rows:28px repeat(9,minmax(0,1fr)) 34px;min-height:0;overflow:hidden}.line h2{text-align:center;font-size:14px;border-bottom:2px solid #4d667b;margin:0;padding:4px}.row{display:grid;grid-template-columns:23px minmax(0,1fr) 29px;align-items:center;border-bottom:1px solid #2a3d4e;font-size:31px;font-weight:900;gap:3px;min-height:0;padding:0 3px}.row span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.row span:first-child{font-size:21px;color:#9fb0c3}.row span:last-child{font-size:17px;color:#9fb0c3}.row.on{background:#ffda32;color:#15202a}.row.on span{color:inherit}.pitcher{display:flex;align-items:center;border-top:1px solid #425465;font-size:23px;font-weight:bold;overflow:hidden;white-space:nowrap}
.center{display:grid;grid-template-rows:minmax(0,1fr) 70px;gap:8px;min-height:0;min-width:0}.hero{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0}.batter{display:grid;grid-template-rows:minmax(0,1fr) 62px;min-width:0;min-height:0}.photo{position:relative;background:radial-gradient(ellipse at bottom,#3a5066,#142230);overflow:hidden;font-size:90px;font-weight:bold;color:#e34259;border:1px solid #476076;display:grid;place-items:center;min-height:0}.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom}.batter-name{display:flex;align-items:center;justify-content:center;gap:8px;background:#af1932;font-size:40px;font-weight:900;white-space:nowrap;overflow:hidden}.batter-name small{font-size:21px;color:#fff}.home-attack .batter{grid-column:2;grid-row:1}.home-attack .state{grid-column:1;grid-row:1}.home-attack .batter-name{background:#1256a4}
.state{border:1px solid #476076;display:flex;flex-direction:column;align-items:center;min-width:0;min-height:0;overflow:hidden;padding:8px}.inning{font-size:33px;font-weight:900;color:#ffdb35;line-height:42px}.count-event{display:flex;align-items:center;gap:7px;width:100%;justify-content:center}.counts{font-size:35px;font-weight:900;line-height:48px;white-space:nowrap}.dot{display:inline-block;width:25px;height:25px;border:2px solid #6c8398;border-radius:50%;margin-left:5px;vertical-align:0}.B{background:#31dd79}.S{background:#ffd52c}.O{background:#ff3d53}.event{max-width:66px;font-size:16px;line-height:1.4;color:#ffdb35;overflow-wrap:anywhere}.diamond{position:relative;width:140px;height:137px;margin-top:4px;flex-shrink:0}.diamond:before{content:'';position:absolute;left:37px;top:42px;width:67px;height:67px;border:3px solid #61768a;transform:rotate(45deg)}.base{position:absolute;width:25px;height:25px;border:3px solid #98aaba;background:#102333;transform:rotate(45deg)}.base.on{background:#ffdc31;border-color:#ffdc31}.b1{left:105px;top:62px}.b2{left:59px;top:16px}.b3{left:13px;top:62px}
.pitch-strip{display:flex;align-items:center;gap:9px;border:1px solid #476076;background:#132638;padding:8px 12px;min-width:0;overflow:hidden}.pitch-label{font-size:15px;color:#a4b7c9;flex-shrink:0}.pitch-strip strong{font-size:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitch-number{font-size:19px;color:#a4b7c9}.velocity{margin-left:auto;white-space:nowrap}.velocity b{font-size:30px}.velocity small{font-size:12px;color:#a4b7c9}.empty{grid-column:1/-1;grid-row:1/-1;display:grid;place-items:center;font-size:28px;text-align:center}.sample-badge{position:absolute;top:3px;left:4px;color:#a4b7c9;font-size:9px}.photo-credit{position:fixed;bottom:2px;right:2px;color:#647586;font-size:7px}body.blank .photo-credit{display:none}
</style></head><body><svg id="displayViewport" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 624" preserveAspectRatio="xMinYMin meet" role="img" aria-label="야구 전광판"><foreignObject x="0" y="0" width="1120" height="624"><div xmlns="http://www.w3.org/1999/xhtml" id="board"></div></foreignObject></svg><a class="photo-credit" href="photo-credits.html" target="_blank">샘플 사진 출처</a><script src="sample-photos.js?v=11"></script><script src="display.js?v=11"></script></body></html>
