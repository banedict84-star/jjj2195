<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANSAN Baseball Control</title><link rel="stylesheet" href="style.css"></head><body><header><div><b>ANSAN BASEBALL</b><small>LIVE GAME CONTROL</small></div><a href="display.html" target="_blank">전광판 송출 ↗</a></header><main><section class="score"><div><small>AWAY</small><b>안산시청</b></div><strong><span id="a">0</span><i>:</i><span id="h">0</span></strong><div class="right"><small>HOME</small><b>용인시청</b></div></section><div class="layout"><aside><article><h3>이닝</h3><div class="triple"><button onclick="inn(-1)">−</button><b id="inning">1회초</b><button onclick="inn(1)">＋</button></div><button class="wide" onclick="half()">초 / 말 전환</button></article><article><h3>점수</h3><div class="two"><button onclick="score('a',1)">원정 +1</button><button onclick="score('h',1)">홈 +1</button><button onclick="score('a',-1)">원정 −1</button><button onclick="score('h',-1)">홈 −1</button></div></article><article><h3>B · S · O</h3><div id="counts"></div></article></aside><section><article class="batter"><div class="photo" id="photo">27</div><div><small>CURRENT BATTER</small><h1 id="name">#27 김민성</h1><p id="pos">SS · 안산시청</p><div class="actions"><button onclick="hit('안타')">안타</button><button onclick="hit('2루타')">2루타</button><button onclick="walk()">볼넷</button><button onclick="out()">타자 아웃</button><button class="hr" onclick="hr()">HOME RUN</button></div></div></article><article><h3>주자</h3><div class="bases"><button id="b1" onclick="base(0)">1루</button><button id="b2" onclick="base(1)">2루</button><button id="b3" onclick="base(2)">3루</button><button onclick="clearBases()">주자 없음</button></div></article><article><h3>투구 속도</h3><input id="speed" type="number" placeholder="0" oninput="setSpeed(this.value)"> <b>km/h</b><button class="undo" onclick="undo()">↶ 직전 기록 취소</button></article></section><aside><article><h3>타순</h3><div id="lineup"></div></article></aside></div></main><script src="app.js"></script></body></html>
