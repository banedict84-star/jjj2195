<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANSAN Baseball OS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#10213a}.app{display:grid;grid-template-columns:205px 1fr;min-height:100vh}.side{background:#0b2039;color:#c7d3e2;padding:24px 14px}.logo{font-size:19px;font-weight:900;color:#fff;margin:5px 10px 28px}.logo small{display:block;font-size:9px;color:#7f93aa;margin-top:5px}.side button{width:100%;border:0;background:transparent;color:#bdcad9;padding:14px;text-align:left;border-radius:8px;margin:3px 0;font-weight:700}.side .on{background:#1769e8;color:#fff}.top{height:74px;background:#fff;border-bottom:1px solid #dde5ee;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.top h2{font-size:19px}.ready{font-size:11px;background:#e8f7ee;color:#27804d;padding:8px 11px;border-radius:20px}.page{padding:24px;max-width:1580px}.head{display:flex;justify-content:space-between;align-items:start}.head h1{margin:0 0 6px;font-size:29px}.muted{color:#7c8ca0}.steps{display:flex;gap:9px;align-items:center;font-size:12px;color:#77879a}.steps b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#8c99a9;color:#fff}.steps .on{background:#1769e8}.teams{display:grid;grid-template-columns:1fr 55px 1fr;gap:12px;align-items:center;margin:20px 0}.team,.panel{background:#fff;border:1px solid #dce5ef;border-radius:12px}.team{padding:17px;display:flex;gap:14px;align-items:center}.badge{width:58px;height:58px;border-radius:50%;background:#edf2f8;display:grid;place-items:center;font-weight:900}.team h3{margin:3px 0;font-size:23px}.vs{text-align:center;font-weight:900;color:#8b98a8}.layout{display:grid;grid-template-columns:1fr 1fr 305px;gap:14px}.panel{padding:15px}.ph{display:flex;justify-content:space-between;align-items:center}.ph h3{margin:0}.search{border:1px solid #d9e2ec;border-radius:8px;padding:9px;width:190px}.filters{display:flex;gap:5px;margin:11px 0}.filters button{border:0;background:#f1f4f8;color:#65758a;border-radius:7px;padding:7px 9px}.filters .on{background:#112b4c;color:#fff}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pc{border:1px solid #dce5ef;border-radius:9px;padding:7px;text-align:center;background:#fff}.pc.sel{border:2px solid #2676e8;background:#f7faff}.face{height:78px;background:#e7edf4;border-radius:7px;display:grid;place-items:center;font-size:30px}.pc b{display:block;font-size:13px;margin-top:6px}.pc small{color:#8b99aa}.order{margin-top:8px}.orow{display:grid;grid-template-columns:24px 34px 1fr 32px;align-items:center;padding:7px;border-bottom:1px solid #edf1f5}.mini{width:30px;height:30px;border-radius:50%;background:#e7edf4;display:grid;place-items:center}.starter{margin-top:15px;background:#f2f7ff;border:1px solid #cfe0fb;border-radius:9px;padding:12px}.bottom{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-top:14px}.form{display:grid;grid-template-columns:85px 1fr 90px 140px 110px;gap:8px;align-items:end}.form input,.form select{border:1px solid #d8e1eb;border-radius:8px;padding:10px}.photo{height:68px;background:#eef2f6;border:1px dashed #bdc9d7;border-radius:8px;display:grid;place-items:center}.primary{border:0;background:#1769e8;color:#fff;border-radius:8px;padding:11px 14px;font-weight:800}.secondary{border:1px solid #cfd9e4;background:#fff;color:#2b5f9d;border-radius:8px;padding:11px 14px;font-weight:800}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}.record{display:grid;grid-template-columns:300px 1fr 330px;gap:14px}.score{font-size:48px;text-align:center;font-weight:900}.big{width:100%;border:0;background:#edf2f7;border-radius:8px;padding:13px;font-weight:800;margin:4px}.output{background:#05090f;aspect-ratio:12/5;color:#fff;border-radius:10px;display:grid;grid-template-rows:24% 76%;overflow:hidden}.outTop{display:grid;grid-template-columns:1fr 240px 1fr;align-items:center;padding:0 35px;border-bottom:1px solid #293442;font-size:25px;font-weight:900}.outTop strong{text-align:center;font-size:50px}.outTop span:last-child{text-align:right}.outBody{display:grid;grid-template-columns:60% 40%}.hero{display:flex;gap:25px;align-items:center;padding:35px}.heroPic{width:210px;height:100%;background:#172331;display:grid;place-items:center;color:#e13240;font-size:72px;font-weight:900}.hero h2{font-size:43px}.state{border-left:1px solid #293442;display:grid;place-items:center;text-align:center}.state h2{font-size:38px}.state strong{font-size:58px}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{display:none}.layout,.record,.bottom{grid-template-columns:1fr}.cards{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="logo">⚾ ANSAN BASEBALL<small>SCOREBOARD & GAME CONTROL</small></div><button class="on" onclick="show('setup',this)">▣ 경기 준비</button><button onclick="show('record',this)">✎ 기록 입력</button><button onclick="show('teams',this)">♟ 팀 / 선수 관리</button><button onclick="show('display',this)">▣ 전광판 송출</button><button>▤ 경기 기록</button><button>⚙ 설정</button></aside><main><header class="top"><h2 id="title">경기 생성 및 엔트리 등록</h2><span class="ready">● SYSTEM READY</span></header><section class="page" id="page"></section></main></div><script>
const A=[[1,'김현우','P'],[11,'이도현','P'],[17,'박준호','P'],[21,'최민석','P'],[29,'정우진','P'],[2,'한지훈','C'],[10,'이성민','C'],[25,'강태명','C'],[3,'김민규','IF'],[7,'박성준','IF'],[13,'정현수','IF'],[16,'오지훈','OF']],H=[[1,'이준호','P'],[18,'박지훈','P'],[27,'김성민','P'],[34,'최진우','P'],[41,'한승민','P'],[2,'정민수','C'],[12,'김도윤','C'],[22,'이현철','IF'],[5,'박민재','IF'],[8,'김태현','IF'],[9,'이수현','OF'],[14,'조현우','OF']];let sel=[0,1,2,3,4,5,6,7,8],g={a:0,h:0,inn:1,half:'초',bat:0,speed:0};function card(p,i,s){return '<div class="pc '+(s?'sel':'')+'" onclick="toggle('+i+')"><div class="face">👤</div><b>'+p[0]+' '+p[1]+'</b><small>'+p[2]+'</small></div>'}function toggle(i){sel.includes(i)?sel=sel.filter(x=>x!==i):sel.push(i);render('setup')}function show(x,e){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('on'));if(e)e.classList.add('on');render(x)}function setup(){return '<div class="head"><div><h1>경기 생성 및 엔트리 등록</h1><div class="muted">오늘 경기의 양 팀을 선택하고 출전 선수 명단을 등록하세요.</div></div><div class="steps"><b>1</b>팀 선택 → <b class="on">2</b>엔트리 구성 → <b>3</b>타순 설정 → <b>4</b>경기 시작</div></div><div class="teams"><div class="team"><div class="badge">A</div><div><small>AWAY TEAM</small><h3>안산시청</h3></div></div><div class="vs">VS</div><div class="team"><div class="badge">Y</div><div><small>HOME TEAM</small><h3>용인시청</h3></div></div></div><div class="layout"><div class="panel"><div class="ph"><h3>선수 명단</h3><input class="search" placeholder="선수명, 등번호 검색"></div><div class="filters"><button class="on">전체</button><button>투수</button><button>포수</button><button>내야수</button><button>외야수</button></div><div class="cards">'+A.map((p,i)=>card(p,i,sel.includes(i))).join('')+'</div></div><div class="panel"><div class="ph"><h3>상대팀 선수 명단</h3><input class="search" placeholder="선수명, 등번호 검색"></div><div class="filters"><button class="on">전체</button><button>투수</button><button>포수</button><button>내야수</button><button>외야수</button></div><div class="cards">'+H.map((p,i)=>card(p,i,false)).join('')+'</div></div><div class="panel"><div class="ph"><h3>오늘 출전 엔트리</h3><b>'+sel.length+'/9</b></div><div class="order">'+sel.slice(0,9).map((i,n)=>'<div class="orow"><b>'+(n+1)+'</b><span class="mini">👤</span><strong>'+A[i][0]+' '+A[i][1]+'</strong><small>'+A[i][2]+'</small></div>').join('')+'</div><div class="starter"><small>선발 투수</small><h3>1 김현우</h3></div></div></div><div class="bottom"><div class="panel"><h3>현장 선수 등록</h3><div class="form"><div class="photo">📷 사진</div><input placeholder="선수명"><input placeholder="등번호"><select><option>포지션</option></select><button class="primary">등록</button></div></div><div class="panel"><h3>경기 메모</h3><input style="width:100%;padding:11px;border:1px solid #d8e1eb;border-radius:8px" placeholder="특이사항 입력"><div class="actions"><button class="secondary">임시 저장</button><button class="primary" onclick="render(\'record\')">라인업 확정 →</button></div></div></div>'}function render(x){if(x==='setup'){title.textContent='경기 생성 및 엔트리 등록';page.innerHTML=setup()}else if(x==='record'){title.textContent='실시간 경기 기록';page.innerHTML='<div class="record"><div class="panel"><h3>LIVE SCORE</h3><div class="score">'+g.a+' : '+g.h+'</div><button class="big" onclick="g.a++;render(\'record\')">원정 +1</button><button class="big" onclick="g.h++;render(\'record\')">홈 +1</button></div><div class="panel"><h3>현재 타자</h3><h1>#'+A[g.bat][0]+' '+A[g.bat][1]+'</h1><p class="muted">'+A[g.bat][2]+' · 안산시청</p><button class="big">안타</button><button class="big">2루타</button><button class="primary" onclick="g.bat=(g.bat+1)%9;render(\'record\')">타자 아웃 → 다음 타자</button></div><div class="panel"><h3>타순</h3>'+sel.slice(0,9).map((i,n)=>'<div class="orow"><b>'+(n+1)+'</b><span class="mini">👤</span><strong>'+A[i][1]+'</strong><small>'+A[i][2]+'</small></div>').join('')+'</div></div>'}else if(x==='display'){title.textContent='전광판 송출';page.innerHTML='<div class="output"><div class="outTop"><span>안산시청</span><strong>'+g.a+' : '+g.h+'</strong><span>용인시청</span></div><div class="outBody"><div class="hero"><div class="heroPic">'+A[g.bat][0]+'</div><div><small>CURRENT BATTER</small><h2>#'+A[g.bat][0]+' '+A[g.bat][1]+'</h2><p>'+A[g.bat][2]+'</p></div></div><div class="state"><div><h2>'+g.inn+'회 '+g.half+'</h2><p>B 0　S 0　O 0</p><strong>— km/h</strong></div></div></div></div>'}else{title.textContent='팀 / 선수 관리';page.innerHTML='<div class="head"><div><h1>팀 / 선수 관리</h1><p class="muted">팀 명단과 선수 사진을 등록하고 관리합니다.</p></div><button class="primary">＋ 새 팀 등록</button></div><div class="teams"><div class="team"><div class="badge">A</div><div><h3>안산시청</h3><small>선수 '+A.length+'명</small></div></div><div></div><div class="team"><div class="badge">Y</div><div><h3>용인시청</h3><small>선수 '+H.length+'명</small></div></div></div>'}}render('setup');
</script></body></html>
