<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안산 야구 전광판 CONTROL</title><link rel="stylesheet" href="control.css"></head><body><header><div><b>ANSAN BASEBALL CONTROL</b><small>LOCAL SCOREBOARD OPERATOR</small></div><div class="status">● 송출 준비</div></header><main><section class="match"><div><small>AWAY</small><b>원정팀</b></div><strong><span id="a">0</span><i>:</i><span id="h">0</span></strong><div class="r"><small>HOME</small><b>홈팀</b></div></section><div class="cols"><aside><Card title="경기 진행"><div class="inn"><button onclick="inning(-1)">−</button><b id="inn">1회초</b><button onclick="inning(1)">＋</button></div><button class="full" onclick="toggleHalf()">초/말 전환</button></Card><Card title="점수"><div class="two"><button onclick="score('a',1)">원정 +1</button><button onclick="score('h',1)">홈 +1</button><button onclick="score('a',-1)">원정 −1</button><button onclick="score('h',-1)">홈 −1</button></div></Card><Card title="B · S · O"><div id="count"></div></Card></aside><section><article class="card current"><div class="portrait" id="portrait">27</div><div class="bio"><small>CURRENT BATTER</small><h1 id="player">#27 김민성</h1><p id="position">SS · 원정팀</p><div class="event" id="event">GAME</div><div class="actions"><button onclick="hit('안타',1)">안타</button><button onclick="hit('2루타',2)">2루타</button><button onclick="walk()">볼넷</button><button onclick="out()">타자 아웃</button><button class="hr" onclick="homeRun()">HOME RUN</button></div></div></article><article class="card"><h3>주자</h3><div class="bases"><button id="base1" onclick="base(0)">1루</button><button id="base2" onclick="base(1)">2루</button><button id="base3" onclick="base(2)">3루</button><button onclick="clearBases()">주자 없음</button></div></article><article class="card speedbox"><div><h3>투구 속도</h3><input id="speed" type="number" placeholder="0" oninput="setSpeed(this.value)"> <b>km/h</b></div><button onclick="undo()">↶ 직전 기록 취소</button></article></section><aside><article class="card"><h3>타순</h3><div id="lineup"></div></article><a class="display" href="display.html" target="_blank">전광판 송출화면 열기 ↗</a></aside></div></main><script src="control.js"></script></body></html>
