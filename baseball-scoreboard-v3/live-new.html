<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANSAN LIVE 1120×624</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;overflow:hidden;font-family:Arial,"Noto Sans KR",sans-serif;color:#fff}#v{transform-origin:0 0}#board{width:1120px;height:624px;background:#05090f;display:grid;grid-template-rows:168px 456px;border:2px solid #40566d}

</style></head><body><div id="v"><div id="board"></div></div><script>
const A=[[27,'김민성','SS',''],[17,'이정훈','2B',''],[36,'박준영','CF',''],[10,'최현우','1B',''],[52,'정재훈','LF',''],[33,'김도현','RF',''],[7,'이서준','3B',''],[21,'한승민','C',''],[18,'오지환','DH','']],H=[[14,'이승현','CF'],[25,'정유민','SS'],[8,'박지훈','1B'],[52,'김태현','RF'],[35,'황민준','LF'],[10,'오성민','3B'],[18,'최준호','C'],[22,'강동현','2B'],[7,'이진우','DH']];let g={a:0,h:0,inn:1,half:'초',b:0,s:0,o:0,bases:[0,0,0],bat:0,speed:0,event:'GAME'};function load(){try{g={...g,...JSON.parse(localStorage.getItem('ansan-origin')||'{}')}}catch(e){}}function dots(n,m,c){return Array.from({length:m},(_,i)=>'<i class="dot '+(i<n?c:'')+'"></i>').join('')}function rows(P,on){return P.map((p,i)=>'<div class="row '+(on&&i===g.bat?'on':'')+'"><span>'+(i+1)+'</span><span>'+p[0]+'</span><span>'+p[1]+'</span><span>'+p[2]+'</span></div>').join('')}function render(){load();let p=A[g.bat%9],heads=Array.from({length:12},(_,i)=>i+1),ph=p[3]?'<img src="'+p[3]+'">':'<span class="no">'+p[0]+'</span><small>PLAYER PHOTO</small>';board.innerHTML='<div class="top"><div class="teams"><div class="team"><span>TEAM</span></div><div class="team away"><span>원정팀</span><small>AWAY</small></div><div class="team home"><span>홈팀</span><small>HOME</small></div></div><div class="innings"><div class="innrow head">'+heads.map(x=>'<div>'+x+'</div>').join('')+'</div><div class="innrow">'+heads.map(x=>'<div></div>').join('')+'</div><div class="innrow">'+heads.map(x=>'<div></div>').join('')+'</div></div><div class="totals"><div class="h">R</div><div class="h">H</div><div class="h">E</div><div class="h">B</div><div>'+g.a+'</div><div>0</div><div>0</div><div>0</div><div>'+g.h+'</div><div>0</div><div>0</div><div>0</div></div></div><div class="main"><div class="line"><h2>AWAY LINE UP</h2>'+rows(A,true)+'</div><div class="center"><div class="hero"><div class="photo">'+ph+'</div><div class="bio"><small>CURRENT BATTER</small><h1><em>#'+p[0]+'</em> '+p[1]+'</h1><p>'+p[2]+' · 원정팀</p><span class="event">'+g.event+'</span></div><div class="game"><div class="inning">'+g.inn+'회 '+g.half+'</div><div class="bso">B '+dots(g.b,3,'B')+'<br>S '+dots(g.s,2,'S')+'<br>O '+dots(g.o,2,'O')+'</div></div></div><div class="bottom"><div class="diamondBox"><i class="base b1 '+(g.bases[0]?'on':'')+'"></i><i class="base b2 '+(g.bases[1]?'on':'')+'"></i><i class="base b3 '+(g.bases[2]?'on':'')+'"></i></div><div class="speed">PITCH SPEED<strong>'+(g.speed||'—')+'</strong>km/h</div><div class="pitch"><small>CURRENT PITCHER</small><b>#99 김태우</b><span>우투우타</span></div></div></div><div class="line"><h2>HOME LINE UP</h2>'+rows(H,false)+'</div></div>';fit()}function fit(){let z=Math.min(innerWidth/1120,innerHeight/624);v.style.transform='scale('+z+')';v.style.width=(1120*z)+'px';v.style.height=(624*z)+'px'}render();fit();setInterval(render,200);addEventListener('resize',fit);addEventListener('storage',render);try{new BroadcastChannel('ansan-origin').onmessage=e=>{g=e.data;render()}}catch(e){}
