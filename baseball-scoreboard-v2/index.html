<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>안산 야구 전광판 운영</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111e;color:#fff;font-family:Arial,sans-serif}header{padding:14px 18px;background:#0d1a2b;display:flex;gap:7px;align-items:center;position:sticky;top:0;z-index:5}header b{margin-right:auto}button,input,select{border:0;border-radius:9px;padding:11px;background:#29415f;color:#fff;font-weight:800}.blue{background:#0875df}.red{background:#a92d3c}.green{background:#23894a}.yellow{background:#8b720c}.page{display:none;padding:14px}.show{display:block}.grid{display:grid;grid-template-columns:300px 1fr 330px;gap:12px}.card{background:#111f31;border:1px solid #2b405b;border-radius:14px;padding:14px;margin-bottom:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.score{text-align:center;font-size:48px;font-weight:900}.row{padding:9px;border-bottom:1px solid #2c4059}.sel{background:#174d82;border-radius:7px}.muted{color:#94a8c0}.photo{width:110px;height:130px;background:#1a2a3e;border-radius:10px;display:grid;place-items:center;overflow:hidden;font-size:45px}.photo img{width:100%;height:100%;object-fit:cover}.playerHead{display:flex;gap:14px;align-items:center}.undo{background:#5a3440}@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style><style>
:root{--navy:#07111f;--panel:#0d1a2a;--panel2:#101f32;--line:rgba(148,170,200,.18);--blue:#2f8cff;--red:#ff4b5f;--gold:#f5c451;--text:#f7f9fc;--muted:#91a4bb}
body{background:radial-gradient(circle at 50% -20%,#183657 0,#091522 38%,#050b12 100%) fixed!important;color:var(--text)!important;letter-spacing:-.2px}
header{height:72px!important;padding:0 24px!important;background:rgba(7,16,29,.92)!important;backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)!important;box-shadow:0 10px 35px rgba(0,0,0,.22)}
header b{font-size:20px;letter-spacing:-.5px}header button{background:transparent!important;border:1px solid rgba(255,255,255,.12)!important;color:#cbd7e5!important}
header button.green{background:linear-gradient(135deg,#1d7cff,#1656d8)!important;color:#fff!important;border:0!important;box-shadow:0 8px 20px rgba(29,124,255,.25)}
.page{max-width:1540px;margin:auto;padding:22px!important}.grid{grid-template-columns:330px minmax(480px,1fr) 350px!important;gap:18px!important}
.card{background:linear-gradient(145deg,rgba(18,34,54,.96),rgba(10,21,35,.98))!important;border:1px solid var(--line)!important;border-radius:20px!important;padding:19px!important;box-shadow:0 16px 40px rgba(0,0,0,.20)}
.card h2,.card h3{margin-top:0;letter-spacing:-.5px}.muted{color:var(--muted)!important}
button,input,select{min-height:44px;border-radius:12px!important;border:1px solid rgba(255,255,255,.09)!important;background:#172a42!important;transition:.15s ease}
button:hover{transform:translateY(-1px);filter:brightness(1.1)}button.blue{background:linear-gradient(135deg,#2589ff,#1264d8)!important}button.red{background:linear-gradient(135deg,#ef5264,#b72e43)!important}button.green{background:linear-gradient(135deg,#2c9b67,#197747)!important}button.yellow{background:linear-gradient(135deg,#c99c37,#8a681d)!important}
.score{font-size:58px!important;line-height:1.05;margin:10px 0 15px;font-variant-numeric:tabular-nums;text-shadow:0 5px 22px rgba(0,0,0,.35)}
#inning{display:inline-block;min-width:92px;font-size:18px}.row{padding:11px 12px!important;border-bottom:1px solid rgba(255,255,255,.07)!important;border-radius:9px;margin:2px 0}.row.sel{background:linear-gradient(90deg,rgba(37,137,255,.3),rgba(37,137,255,.06))!important;box-shadow:inset 3px 0 #4ca0ff}
.playerHead{padding:8px}.photo{width:126px!important;height:148px!important;border:1px solid rgba(255,255,255,.13);box-shadow:0 12px 28px rgba(0,0,0,.3)}
#batter{font-size:34px!important}#event{background:rgba(245,196,81,.12)!important;color:#ffd96e!important;border:1px solid rgba(245,196,81,.3)}
input,select{background:#091522!important;border:1px solid #30445d!important;padding:12px 14px!important;font-weight:600!important}
#teams .card{background:#0d1a2a!important}.three{gap:9px!important}.two{gap:9px!important}
@media(max-width:950px){header{height:auto!important;padding:12px!important;flex-wrap:wrap}.page{padding:12px!important}.grid{grid-template-columns:1fr!important}.card{border-radius:16px!important}.score{font-size:50px!important}}
</style></head><body><header><b>⚾ ANSAN BASEBALL CONTROL</b><button onclick="show('dash')">기록원</button><button onclick="show('teams')">팀·선수 관리</button><button class="green" onclick="location.href='display.html'">송출화면 ↗</button></header>
<section id="dash" class="page show"><div class="grid"><div>
<div class="card"><div id="match" class="muted" style="text-align:center"></div><div class="score"><span id="sa"></span> : <span id="sh"></span></div><div style="text-align:center"><button onclick="changeInn(-1)">◀</button> <b id="inning"></b> <button onclick="changeInn(1)">▶</button> <button onclick="toggleHalf()">초/말</button></div><div class="two" style="margin-top:9px"><button class="blue" onclick="score('a',1)">원정 +1</button><button class="red" onclick="score('h',1)">홈 +1</button><button onclick="score('a',-1)">원정 -1</button><button onclick="score('h',-1)">홈 -1</button></div></div>
<div class="card"><h3>B · S · O</h3><button onclick="count('b')">BALL +</button> <b id="b"></b><br><br><button onclick="count('s')">STRIKE +</button> <b id="s"></b><br><br><button onclick="out()">OUT +</button> <b id="o"></b><br><br><button class="red" onclick="changeSide()">공수교대</button></div>
<div class="card"><h3>주자</h3><div class="three"><button id="r1" onclick="base(0)">1루</button><button id="r2" onclick="base(1)">2루</button><button id="r3" onclick="base(2)">3루</button></div><button style="width:100%;margin-top:7px" onclick="clearBases()">주자 없음</button></div></div>
<div><div class="card"><h3>현재 타자</h3><div class="playerHead"><div class="photo" id="curPhoto">👤</div><div><div id="batter" style="font-size:30px;font-weight:900"></div><div id="event" class="yellow" style="display:inline-block;padding:7px;border-radius:8px;margin-top:8px"></div></div></div><div class="three" style="margin-top:12px"><button class="green" onclick="hit('안타',1)">안타</button><button class="yellow" onclick="hit('2루타',2)">2루타</button><button onclick="hit('3루타',3)">3루타</button><button class="red" onclick="homeRun()">홈런</button><button onclick="walk()">볼넷</button><button onclick="out()">타자 아웃</button></div></div>
<div class="card"><h3>투구 속도</h3><input id="speed" type="number" oninput="editSpeed(this.value)" style="width:100%" placeholder="km/h"></div>
<div class="card"><h3>실수 수정</h3><div class="two"><button class="undo" onclick="undo()">↶ 직전 기록 취소</button><button onclick="resetCount()">B/S 초기화</button></div><p class="muted">득점·볼·스트라이크·아웃·주자·타자 변경 등 직전 조작을 되돌릴 수 있습니다.</p></div></div>
<div><div class="card"><h3>현재 공격팀 라인업</h3><div id="lineup"></div></div><div class="card"><button class="blue" style="width:100%" onclick="nextBatter()">다음 타자</button><p class="muted">타자 아웃/삼진 시 다음 타자로 자동 이동합니다.</p></div></div></div></section>
<section id="teams" class="page"><div class="card"><h2>팀·선수 관리</h2><p class="muted">팀과 선수는 이 브라우저에 저장됩니다. 사진도 선수별로 등록할 수 있습니다.</p><div class="two"><select id="teamPick" onchange="renderTeam()"></select><button class="green" onclick="addTeam()">+ 팀 추가</button></div></div><div class="card"><div id="teamPlayers"></div><hr style="border-color:#31455f"><h3>선수 추가</h3><div class="three"><input id="pn" placeholder="등번호"><input id="pname" placeholder="이름"><input id="ppos" placeholder="포지션"></div><input id="pimg" type="file" accept="image/*" style="width:100%;margin-top:8px"><button class="green" style="width:100%;margin-top:8px" onclick="addPlayer()">선수 등록</button></div></section>
<script>
const defaults=[{id:'ansan',name:'안산시청',players:[[27,'김민성','SS',''],[17,'이정훈','2B',''],[36,'박준영','CF',''],[10,'최현우','1B',''],[52,'정재훈','LF',''],[33,'김도현','RF',''],[7,'이서준','3B',''],[21,'한승민','C',''],[18,'오지환','DH','']]},{id:'yongin',name:'용인시청',players:[[14,'이승현','CF',''],[25,'정유민','SS',''],[8,'박지훈','1B',''],[52,'김태현','RF',''],[35,'황민준','LF',''],[10,'오성민','3B',''],[18,'최준호','C',''],[22,'강동현','2B',''],[7,'이진우','DH','']]}];
let teams=JSON.parse(localStorage.getItem('ansan-teams')||'null')||defaults;
let g=JSON.parse(localStorage.getItem('ansan-live')||'null')||{away:'ansan',home:'yongin',a:0,h:0,i:1,half:'초',b:0,s:0,o:0,bases:[0,0,0],bat:0,speed:0,event:'GAME'};
let history=[];
const T=id=>teams.find(x=>x.id===id)||teams[0];
function snapshot(){history.push(JSON.stringify(g));if(history.length>30)history.shift()}
function save(){localStorage.setItem('ansan-live',JSON.stringify(g));localStorage.setItem('ansan-teams',JSON.stringify(teams));render()}
function act(fn){snapshot();fn();save()} function undo(){if(history.length){g=JSON.parse(history.pop());save()}}
function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('show'));document.getElementById(x).classList.add('show');if(x==='teams')renderTeam()}
function score(k,d){act(()=>g[k]=Math.max(0,g[k]+d))}function changeInn(d){act(()=>g.i=Math.max(1,Math.min(12,g.i+d)))}function toggleHalf(){act(()=>g.half=g.half==='초'?'말':'초')}
function count(k){act(()=>{g[k]++;if(k==='b'&&g.b>=4){g.b=g.s=0;g.bases[0]=1;advance()}if(k==='s'&&g.s>=3){g.b=g.s=0;g.o++;advance();if(g.o>=3)sideLogic()}})}
function out(){act(()=>{g.o++;g.b=g.s=0;g.event='OUT';advance();if(g.o>=3)sideLogic()})}
function sideLogic(){g.o=g.b=g.s=0;g.bases=[0,0,0];if(g.half==='초')g.half='말';else{g.half='초';g.i=Math.min(12,g.i+1)}g.bat=0}
function changeSide(){act(sideLogic)}function base(i){act(()=>g.bases[i]^=1)}function clearBases(){act(()=>g.bases=[0,0,0])}function resetCount(){act(()=>{g.b=g.s=0})}
function advance(){g.bat=(g.bat+1)%Math.max(1,T(g.half==='초'?g.away:g.home).players.length)}function nextBatter(){act(()=>{advance();g.b=g.s=0})}
function hit(label,n){act(()=>{g.event=label;g.b=g.s=0;if(n===1)g.bases[0]=1;if(n===2)g.bases[1]=1;if(n===3)g.bases[2]=1;advance()})}function walk(){hit('볼넷',1)}function homeRun(){act(()=>{g.event='HOME RUN';let runs=1+g.bases.filter(Boolean).length;if(g.half==='초')g.a+=runs;else g.h+=runs;g.bases=[0,0,0];g.b=g.s=0;advance()})}
function editSpeed(v){g.speed=+v||0;save()}
function render(){let offense=T(g.half==='초'?g.away:g.home),p=offense.players[g.bat%offense.players.length];match.textContent=T(g.away).name+' vs '+T(g.home).name;sa.textContent=g.a;sh.textContent=g.h;inning.textContent=g.i+'회'+g.half;b.textContent=g.b;s.textContent=g.s;o.textContent=g.o;batter.textContent='#'+p[0]+' '+p[1]+' · '+p[2];event.textContent=g.event;speed.value=g.speed||'';curPhoto.innerHTML=p[3]?'<img src="'+p[3]+'">':'👤';lineup.innerHTML=offense.players.map((x,i)=>'<div class="row '+(i===g.bat?'sel':'')+'" onclick="act(()=>g.bat='+i+')">'+(i+1)+'. #'+x[0]+' '+x[1]+' · '+x[2]+'</div>').join('');[r1,r2,r3].forEach((x,i)=>x.style.background=g.bases[i]?'#8b720c':'#29415f');teamPick.innerHTML=teams.map(t=>'<option value="'+t.id+'">'+t.name+'</option>').join('')}
function renderTeam(){let t=T(teamPick.value||teams[0].id);teamPick.value=t.id;teamPlayers.innerHTML='<h3>'+t.name+'</h3>'+t.players.map((p,i)=>'<div class="row">#'+p[0]+' '+p[1]+' · '+p[2]+' '+(p[3]?'📷':'')+' <button class="red" style="float:right;padding:5px" onclick="delPlayer('+i+')">삭제</button></div>').join('')}
function addTeam(){let name=prompt('팀 이름');if(!name)return;let id='t'+Date.now();teams.push({id,name,players:[]});save();teamPick.value=id;renderTeam()}
function delPlayer(i){let t=T(teamPick.value);t.players.splice(i,1);save();renderTeam()}
function addPlayer(){let t=T(teamPick.value),file=pimg.files[0];let done=img=>{t.players.push([pn.value||0,pname.value||'선수',ppos.value||'',img||'']);pn.value=pname.value=ppos.value='';pimg.value='';save();renderTeam()};if(file){let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(file)}else done('')}
render();
</script></body></html>
